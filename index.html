<title>Nomenclatura Química</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Spline+Sans+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: una columna de estudio (máx. 860px) con barra fija arriba; las tarjetas de iones imitan las casillas de la tabla periódica */
:root {
  --bg: #eef2f0;
  --surface: #ffffff;
  --surface-2: #f6f8f7;
  --ink: #15211e;
  --muted: #56645f;
  --line: #d3dcd8;
  --accent: #0e6a62;
  --accent-ink: #ffffff;
  --accent-soft: #d8ece9;
  --cat: #a8501c;
  --cat-soft: #f7e6da;
  --an: #2552a0;
  --an-soft: #dfe8f7;
  --good: #23743a;
  --good-soft: #def0e2;
  --bad: #b02a22;
  --bad-soft: #f8e1df;
  --warn: #8a5a00;
  --f-display: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif;
  --f-body: 'Atkinson Hyperlegible', 'Segoe UI', system-ui, sans-serif;
  --f-mono: 'Spline Sans Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --r: 10px;
  --ion: #c2551f; --teo: #2a5bd7; --prac: #0e8a7e; --vul: #b0337a; --gold: #c98a06;
  --t1: #2a5bd7; --t2: #1f8a4c; --t3: #8b3fc4;
  --deco-op: 0.14; --glow: 16%;
  --sec: var(--accent);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1614; --surface: #17211e; --surface-2: #1d2925; --ink: #e4ece9; --muted: #9aaba5; --line: #2c3a35;
    --accent: #52c2b4; --accent-ink: #0b1513; --accent-soft: #173733; --cat: #f0a073; --cat-soft: #3a2519;
    --an: #8fb1f2; --an-soft: #1c2840; --good: #73cf8a; --good-soft: #17301f; --bad: #f2928a; --bad-soft: #3a1d1b; --warn: #e6b55c;
    --ion: #f29a68; --teo: #86a8ff; --prac: #4fd0c0; --vul: #f08ac4; --gold: #f2c45a;
    --t1: #86a8ff; --t2: #6fd492; --t3: #c49bf5; --deco-op: 0.11; --glow: 10%;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1614; --surface: #17211e; --surface-2: #1d2925; --ink: #e4ece9; --muted: #9aaba5; --line: #2c3a35;
  --accent: #52c2b4; --accent-ink: #0b1513; --accent-soft: #173733; --cat: #f0a073; --cat-soft: #3a2519;
  --an: #8fb1f2; --an-soft: #1c2840; --good: #73cf8a; --good-soft: #17301f; --bad: #f2928a; --bad-soft: #3a1d1b; --warn: #e6b55c;
  --ion: #f29a68; --teo: #86a8ff; --prac: #4fd0c0; --vul: #f08ac4; --gold: #f2c45a;
  --t1: #86a8ff; --t2: #6fd492; --t3: #c49bf5; --deco-op: 0.11; --glow: 10%;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
h1, h2, h3, h4 { font-family: var(--f-display); line-height: 1.15; text-wrap: balance; margin: 0; }
p { margin: 0; }
sub, sup { font-size: 0.68em; line-height: 0; }
a { color: var(--accent); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.mono, .fx, .field.mono { font-family: var(--f-mono); }
.muted { color: var(--muted); }
.small { font-size: 0.875rem; }
.num { font-variant-numeric: tabular-nums; }
kbd { font-family: var(--f-mono); font-size: 0.75em; border: 1px solid currentColor; border-radius: 4px; padding: 0 4px; opacity: 0.7; }

/* Barra superior */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top-in { max-width: 860px; margin: 0 auto; display: flex; align-items: center; gap: 16px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.brand { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--ink); font-family: var(--f-display); font-weight: 800; font-size: 1.05rem; flex: none; }
.brand-tile { display: grid; place-items: center; width: 30px; height: 30px; border: 2px solid var(--accent); border-radius: 6px; color: var(--accent); font-size: 0.9rem; position: relative; }
.brand-tile::after { content: "3+"; position: absolute; top: -2px; right: 1px; font-size: 0.5rem; font-family: var(--f-mono); }
.nav { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; min-width: 0; }
.nav::-webkit-scrollbar { display: none; }
.nav a { text-decoration: none; color: var(--muted); padding: 6px 12px; border-radius: 999px; white-space: nowrap; font-weight: 700; font-size: 0.92rem; }
.nav a:hover { color: var(--ink); background: var(--surface-2); }
.nav a[aria-current="page"] { color: var(--accent-ink); background: var(--accent); }
@media (max-width: 560px) { .brand-name { display: none; } .top-in { gap: 10px; } }

main { max-width: 860px; margin: 0 auto; padding-block: 24px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 20px; }
main > * { min-width: 0; }

.eyebrow { font-family: var(--f-mono); font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--accent); margin-bottom: 6px; }
.hero h1 { font-size: clamp(2.1rem, 7vw, 3.4rem); font-weight: 800; letter-spacing: -0.02em; }
.page-head h1 { font-size: clamp(1.8rem, 5.5vw, 2.5rem); font-weight: 800; letter-spacing: -0.015em; }
.lede { color: var(--muted); max-width: 60ch; margin-top: 8px; font-size: 1.05rem; }
.h-sm { font-size: 1.15rem; margin-bottom: 6px; }

/* Inicio */
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 560px) { .tiles { grid-template-columns: 1fr; } }
.tile { display: flex; flex-direction: column; gap: 4px; padding: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); text-decoration: none; color: var(--ink); position: relative; transition: border-color .15s, transform .15s; min-height: 150px; }
.tile:hover { border-color: var(--accent); transform: translateY(-1px); }
.tile-k { font-family: var(--f-display); font-weight: 700; font-size: 1.2rem; }
.tile-big { font-family: var(--f-display); font-weight: 800; font-size: 2.2rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.tile-big small { font-size: 1rem; color: var(--muted); font-weight: 500; }
.tile-sub { color: var(--muted); font-size: 0.9rem; }
.mini-tiles { position: absolute; top: 16px; right: 16px; display: flex; gap: 6px; }
.mini-tiles b { font-family: var(--f-mono); font-size: 0.8rem; padding: 4px 6px; border-radius: 5px; border: 1.5px solid currentColor; }
.mini-tiles .cat { color: var(--cat); } .mini-tiles .an { color: var(--an); }
@media (max-width: 380px) { .mini-tiles { display: none; } }
.bars { display: grid; gap: 6px; margin-top: 6px; }
.bar-row { display: grid; grid-template-columns: 60px 1fr 40px; align-items: center; gap: 8px; font-size: 0.85rem; }
.bar-row .num { text-align: right; }
.bar { display: block; height: 8px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 99px; overflow: hidden; flex: 1; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .3s; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; }
.panel ol { margin: 8px 0; padding-left: 20px; display: grid; gap: 6px; }
.weak { list-style: none; padding: 0; margin: 8px 0 0; display: grid; gap: 4px; }
.weak li { display: flex; justify-content: space-between; border-bottom: 1px dashed var(--line); padding: 4px 0; }
.weak .num { color: var(--bad); font-weight: 700; }

/* Controles */
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; flex-wrap: wrap; max-width: 100%; }
.seg button { border: 0; background: none; padding: 7px 16px; border-radius: 999px; cursor: pointer; font-weight: 700; color: var(--muted); }
.seg button[aria-selected="true"] { background: var(--ink); color: var(--bg); }
.seg.small button { padding: 5px 12px; font-size: 0.9rem; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: 999px; cursor: pointer; font-size: 0.9rem; text-align: left; }
.chip .num { color: var(--muted); font-size: 0.8rem; margin-left: 4px; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); font-weight: 700; }
.chip.right { border-color: var(--good); background: var(--good-soft); font-weight: 700; }
.chip.wrong { border-color: var(--bad); background: var(--bad-soft); text-decoration: line-through; }
.toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
.sel { display: flex; align-items: center; gap: 8px; font-size: 0.9rem; color: var(--muted); }
select { font: inherit; padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.btn { border: 1px solid var(--line); background: var(--surface); padding: 10px 18px; border-radius: 8px; cursor: pointer; font-weight: 700; text-decoration: none; color: var(--ink); display: inline-flex; align-items: center; gap: 8px; justify-content: center; }
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.good { background: var(--good-soft); border-color: var(--good); color: var(--ink); }
.btn.bad { background: var(--bad-soft); border-color: var(--bad); color: var(--ink); }
.btn.big { padding: 14px 28px; font-size: 1.1rem; justify-self: start; }
.btn.wide { flex: 1; }
.linkish { background: none; border: 0; color: var(--accent); cursor: pointer; padding: 4px 0; font-weight: 700; }

/* Tarjetas */
.fc-meta { display: flex; align-items: center; gap: 12px; font-size: 0.9rem; color: var(--muted); }
.flash { display: block; width: 100%; max-width: 520px; margin: 0 auto; aspect-ratio: 8 / 5; perspective: 1200px; background: none; border: 0; padding: 0; cursor: pointer; }
.flash-in { display: block; position: relative; width: 100%; height: 100%; transition: transform .45s cubic-bezier(.3,.7,.3,1); transform-style: preserve-3d; }
.flash.is-flipped .flash-in { transform: rotateY(180deg); }
.flash-face { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; padding: 20px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface); backface-visibility: hidden; -webkit-backface-visibility: hidden; text-align: center; }
.flash-face.back { transform: rotateY(180deg); background: var(--surface-2); border-color: var(--accent); }
.face-name { font-family: var(--f-display); font-weight: 700; font-size: clamp(1.4rem, 5vw, 2.1rem); }
.face-sym { font-family: var(--f-mono); font-weight: 600; font-size: clamp(2.4rem, 10vw, 3.6rem); }
.face-sym .st { display: inline-block; font-size: 0.55em; border: 1.5px solid currentColor; border-radius: 6px; padding: 2px 8px; margin: 3px; }
.face-sym.cat { color: var(--cat); } .face-sym.an { color: var(--an); } .face-sym.acc { color: var(--accent); }
.face-note { color: var(--muted); font-size: 0.9rem; }
.flip-hint { position: absolute; bottom: 12px; font-size: 0.75rem; color: var(--muted); }
.fc-actions { max-width: 520px; margin: 0 auto; width: 100%; }
.fc-actions .btn { flex: 1; }
#ion-stage, #vulg-stage { display: grid; gap: 14px; }
.deck-done { text-align: center; padding: 28px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); display: grid; gap: 8px; justify-items: center; }
.deck-done h3 { font-size: 1.8rem; }
@media (prefers-reduced-motion: reduce) { .flash-in, .bar i, .tile { transition: none; } }

.ion-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 8px; }
.ion-tile { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; position: relative; }
.ion-tile.known::after { content: "✓"; position: absolute; top: 6px; right: 8px; color: var(--good); font-weight: 700; font-size: 0.8rem; }
.ion-sym { font-family: var(--f-mono); font-weight: 600; font-size: 1.35rem; }
.ion-sym.cat { color: var(--cat); } .ion-sym.an { color: var(--an); }
.ion-sym .st { font-size: 0.75rem; border: 1px solid currentColor; border-radius: 4px; padding: 0 4px; margin-right: 2px; }
.ion-name { font-size: 0.9rem; }
.ion-note { font-size: 0.75rem; color: var(--muted); }

/* Teoría */
.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.tabs button { flex: 0 1 auto; max-width: 100%; white-space: normal; text-align: left; border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: 8px; cursor: pointer; font-weight: 700; color: var(--muted); }
.tabs button[aria-selected="true"] { border-color: var(--accent); color: var(--ink); box-shadow: inset 0 -3px 0 var(--accent); }
.tab-sub { margin-top: -10px; }
.theory { display: grid; gap: 16px; }
.grp { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px; display: grid; gap: 12px; }
.grp h3 { font-size: 1.35rem; }
.grp h4 { font-size: 1rem; margin-bottom: 4px; }
.grp p { max-width: 70ch; }
.meta { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin: 0; }
@media (max-width: 560px) { .meta { grid-template-columns: 1fr; } }
.meta div { background: var(--surface-2); border-radius: 8px; padding: 10px 12px; }
.meta dt { font-family: var(--f-mono); font-size: 0.7rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.meta dd { margin: 2px 0 0; }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; }
table.sys { border-collapse: collapse; width: 100%; font-size: 0.92rem; min-width: 560px; }
table.sys th { text-align: left; font-family: var(--f-mono); font-size: 0.7rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); background: var(--surface-2); padding: 8px 10px; }
table.sys td { padding: 9px 10px; border-top: 1px solid var(--line); vertical-align: top; }
table.sys td.ex { white-space: nowrap; }
.sys-tag { display: inline-block; font-family: var(--f-mono); font-weight: 600; font-size: 0.78rem; padding: 2px 7px; border-radius: 5px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
.sys-tag.big { font-size: 1rem; padding: 4px 10px; }
.arr { color: var(--muted); }
.fx { font-weight: 500; }
.tree { display: grid; gap: 10px; }
.tree .node { border-left: 3px solid var(--accent); padding: 4px 0 4px 14px; }
.tree ul { margin: 6px 0 0; padding-left: 18px; display: grid; gap: 4px; }
.pref { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 560px) { .pref { grid-template-columns: 1fr; } }
.pref p { display: flex; flex-wrap: wrap; gap: 6px; }
.pref span { background: var(--surface-2); border-radius: 6px; padding: 3px 8px; font-size: 0.9rem; }
.pref b { font-family: var(--f-mono); color: var(--accent); margin-right: 4px; }
.worked { background: var(--surface-2); border-radius: 8px; padding: 10px 14px; font-size: 0.95rem; }
.swap { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.swap div { border: 1.5px dashed var(--accent); border-radius: 8px; padding: 10px 14px; font-size: 1.1rem; }
.swap span { display: block; font-size: 0.85rem; color: var(--muted); }
.steps ol { margin: 4px 0 0; padding-left: 20px; display: grid; gap: 4px; }
.cta-row { display: flex; justify-content: flex-end; }

/* Práctica */
.setup { display: grid; gap: 20px; }
fieldset { border: 0; padding: 0; margin: 0; min-width: 0; display: grid; gap: 8px; }
legend { font-family: var(--f-display); font-weight: 700; font-size: 1.05rem; margin-bottom: 8px; padding: 0; }
.opt-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 560px) { .opt-grid { grid-template-columns: 1fr; } }
.opt { text-align: left; border: 1.5px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 14px; cursor: pointer; display: flex; flex-direction: column; gap: 2px; }
.opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.opt-k { font-family: var(--f-mono); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--accent); }
.opt-t { font-family: var(--f-display); font-weight: 700; font-size: 1.1rem; }
.opt-s, .opt-p { font-size: 0.85rem; color: var(--muted); }
.opt-p { color: var(--accent); font-weight: 700; }
.q-top { display: flex; align-items: center; gap: 12px; }
.q-top .num { color: var(--muted); font-size: 0.9rem; white-space: nowrap; }
.qcard { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 22px; display: grid; gap: 14px; }
.q-tags { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.tag { font-size: 0.8rem; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.tag.prac { border-color: var(--cat); color: var(--cat); background: var(--cat-soft); font-weight: 700; }
.q-formula { font-family: var(--f-mono); font-weight: 600; font-size: clamp(2.2rem, 9vw, 3.4rem); line-height: 1.2; overflow-wrap: anywhere; }
.q-name { font-family: var(--f-display); font-weight: 700; font-size: clamp(1.5rem, 5.5vw, 2.2rem); overflow-wrap: anywhere; }
.q-ask { color: var(--muted); }
.lbl { font-weight: 700; font-size: 0.9rem; }
.field { width: 100%; font: inherit; font-size: 1.1rem; padding: 12px 14px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--surface-2); color: var(--ink); }
.field:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.field[readonly] { opacity: 0.8; }
.f-wrap { display: grid; gap: 4px; }
.f-preview { font-family: var(--f-mono); font-size: 1.6rem; min-height: 2.2rem; color: var(--accent); overflow-wrap: anywhere; }
.keypad { display: grid; gap: 6px; }
.kp-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(48px, 1fr)); gap: 6px; }
.kp-row button { min-height: 44px; border: 1px solid var(--line); background: var(--surface-2); border-radius: 8px; cursor: pointer; font-family: var(--f-mono); font-weight: 600; font-size: 1.05rem; }
.kp-row.els button { background: var(--surface); border-color: var(--ink); }
.kp-row button:active { background: var(--accent-soft); }
.kp-row.ops button[data-k="clear"] { grid-column: span 2; font-family: var(--f-body); font-size: 0.9rem; }
.groups .chips { gap: 6px; }
.q-actions { justify-content: flex-end; }
.hint { background: var(--accent-soft); border-radius: 8px; padding: 10px 14px; font-size: 0.95rem; }
.warn { color: var(--warn); font-weight: 700; }
.fb { border-radius: 10px; padding: 16px; display: grid; gap: 8px; border: 1.5px solid; }
.fb.is-ok { border-color: var(--good); background: var(--good-soft); }
.fb.is-bad { border-color: var(--bad); background: var(--bad-soft); }
.verdict { font-family: var(--f-display); font-weight: 800; font-size: 1.2rem; }
.verdict.good { color: var(--good); } .verdict.bad { color: var(--bad); }
.answer { font-size: 1.15rem; }
.steps-list { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 0.93rem; }
.steps-list .err { color: var(--bad); font-weight: 700; }
.res-list { list-style: none; padding: 0; margin: 0; display: grid; gap: 6px; }
.res-list li { display: grid; grid-template-columns: 28px minmax(90px, auto) 1fr; gap: 10px; align-items: baseline; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
.res-list .mark { font-weight: 800; }
.res-list .ok .mark { color: var(--good); } .res-list .no .mark { color: var(--bad); }
.res-f { font-family: var(--f-mono); font-weight: 600; }
.res-n { min-width: 0; }
.res-n small { display: block; color: var(--muted); }
@media (max-width: 480px) { .res-list li { grid-template-columns: 24px 1fr; } .res-n { grid-column: 2; } }

/* Quiz vulgares */

<script>
/* ===== Motor de nomenclatura (sin DOM) ===== */
const ROM = ['', 'I', 'II', 'III', 'IV', 'V', 'VI', 'VII', 'VIII'];
const GR = ['', 'mono', 'di', 'tri', 'tetra', 'penta', 'hexa', 'hepta', 'octa', 'nona', 'deca', 'undeca'];

const OXP = ['', 'monóxido', 'dióxido', 'trióxido', 'tetróxido', 'pentóxido', 'hexóxido', 'heptóxido'];
const OXP_ALT = ['', 'óxido', 'dióxido', 'trióxido', 'tetraóxido', 'pentaóxido', 'hexaóxido', 'heptaóxido'];
const pre = n => (n > 1 ? GR[n] : '');
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const gcd = (a, b) => (b ? gcd(b, a % b) : a);

/* Elementos tal como aparecen en la hoja de números de oxidación */
const EL = {
  H: { n: 'hidrógeno', fixed: 1, cl: 'nm' },
  Li: { n: 'litio', fixed: 1 }, Na: { n: 'sodio', fixed: 1 }, K: { n: 'potasio', fixed: 1 },
  Rb: { n: 'rubidio', fixed: 1 }, Cs: { n: 'cesio', fixed: 1 }, Fr: { n: 'francio', fixed: 1 }, Ag: { n: 'plata', fixed: 1 },
  Be: { n: 'berilio', fixed: 2 }, Mg: { n: 'magnesio', fixed: 2 }, Ca: { n: 'calcio', fixed: 2 }, Sr: { n: 'estroncio', fixed: 2 },

  Al: { n: 'aluminio', fixed: 3 }, B: { n: 'boro', fixed: 3, cl: 'nm' }, Ga: { n: 'galio', fixed: 3 }, In: { n: 'indio', fixed: 3 },

  S: { n: 'azufre', ox: [2, 4, 6], sa: { 2: 'hiposulfuroso', 4: 'sulfuroso', 6: 'sulfúrico' }, cl: 'nm' },
  Se: { n: 'selenio', ox: [2, 4, 6], sa: { 2: 'hiposelenioso', 4: 'selenioso', 6: 'selénico' }, cl: 'nm' },
  Te: { n: 'telurio', ox: [2, 4, 6], sa: { 2: 'hipoteluroso', 4: 'teluroso', 6: 'telúrico' }, cl: 'nm' },
  Cr: { n: 'cromo', ox: [2, 3, 6] }, Mn: { n: 'manganeso', ox: [2, 3, 4, 6, 7] },

  O: { n: 'oxígeno', cl: 'nm' }, F: { n: 'flúor', cl: 'nm' },

const SYMBOLS = Object.keys(EL);

const FIX_M = ['Li', 'Na', 'K', 'Rb', 'Cs', 'Fr', 'Ag', 'Be', 'Mg', 'Ca', 'Sr', 'Ba', 'Zn', 'Cd', 'Al', 'Ga', 'In', 'Y', 'Sc', 'Zr', 'Hf'];
const VAR_M = ['Hg', 'Au', 'Cu', 'Fe', 'Co', 'Ni', 'Pb', 'Sn', 'Pt', 'Bi'];
const MANY_M = ['Cr', 'Mn', 'V', 'Mo'];
const NM_HYD = ['C', 'N', 'P', 'As', 'Sb', 'Ge', 'Cl', 'Br', 'I', 'S', 'Se', 'Te', 'B', 'Si'];
const NM_OX = ['C', 'N', 'P', 'S', 'Se', 'Te', 'Cl', 'Br', 'I'];

function cat(sym, q) {
  if (sym === 'NH4') return { sym, f: 'NH4', q: 1, name: 'amonio', fixed: true, sa: null, cl: 'm', poly: true };
  const e = EL[sym];
  if (q == null) q = e.fixed;
  return { sym, f: sym, q, name: e.n, fixed: !!e.fixed, sa: e.sa ? e.sa[q] || null : null, cl: e.cl || 'm', poly: false };
}
function randMetalCat(opts = {}) {
  const r = Math.random();
  let c;
  if (r < 0.38 || opts.fixedOnly) c = cat(pick(FIX_M));
  else if (r < 0.86 || opts.noMany) { const s = pick(VAR_M); c = cat(s, pick(EL[s].ox)); }
  else { const s = pick(MANY_M); c = cat(s, pick(EL[s].ox)); }
  if (opts.minQ && c.q < opts.minQ) return randMetalCat(opts);
  return c;
}

/* Aniones monoatómicos */
const MONO_AN = {

  BrO2: { f: 'BrO2', q: 1, name: 'bromito', acid: 'bromoso', c: 'Br', no: 2, root: 'bromato' },
  BrO3: { f: 'BrO3', q: 1, name: 'bromato', acid: 'brómico', c: 'Br', no: 3, root: 'bromato' },

  IO3: { f: 'IO3', q: 1, name: 'yodato', acid: 'yódico', c: 'I', no: 3, root: 'yodato' },
  IO4: { f: 'IO4', q: 1, name: 'peryodato', acid: 'peryódico', c: 'I', no: 4, root: 'yodato' },

  CrO4: { f: 'CrO4', q: 2, name: 'cromato', acid: 'crómico', c: 'Cr', no: 4, root: 'cromato' },

function parseFormula(raw) {

    for (const k in r.c) total[k] = (total[k] || 0) + r.c[k] * mult;

function parseSeg(s) {
  const stack = [{}];

  while (i < s.length) {
    const ch = s[i];

      if (stack.length < 2) return { err: 'Sobra un paréntesis de cierre.' };
      i++; const n = num(); const top = stack.pop(); const cur = stack[stack.length - 1];
      for (const k in top) cur[k] = (cur[k] || 0) + top[k] * n;

      let sym = ch; i++;
      if (i < s.length && /[a-z]/.test(s[i])) { sym += s[i]; i++; }

function patternFor(c, sys) {
  if (sys === 'NV') return PAT.gen.NV;
  if (c.type === 'hidrato') return PAT.hidrato._ + ' · Sal: ' + patternFor(c.base, sys);
  return (PAT[c.type] && PAT[c.type][sys]) || PAT.gen[sys];
}

const qs = (q, sign) => `${q}${sign}`;
function chargeNotes(c) {
  const notes = [];
  if (c.type === 'hidrato') return chargeNotes(c.base);
  const neg = c.ans.reduce((t, [i, n]) => t + i.q * n, 0) + c.oh;
  for (const [ci, nC] of c.cats) {
    if (ci.sym === 'H' && c.type !== 'peroxido') continue;
    if (ci.fixed) notes.push(`${ci.f}${ci.poly ? ' (amonio)' : ''} siempre tiene carga ${qs(ci.q, '+')}.`);
    else if (c.cats.length === 1) {
      const parts = c.ans.map(([i, n]) => `${n} × ${i.f === 'O2' ? 'O₂' : i.f} (${i.q}−)`).concat(c.oh ? [`${c.oh} × OH (1−)`] : []);
      notes.push(`Carga del ${ci.name}: ${parts.join(' + ')} = ${neg}−, repartido entre ${nC} ${ci.f} → ${ci.q}+.`);
    } else notes.push(`El ${ci.name} aquí tiene carga ${ci.q}+ (la suma de cargas debe dar cero).`);
    if (!ci.fixed && ci.sa) {
      const e = EL[ci.sym];
      notes.push(`Nombres antiguos del ${ci.name}: ${e.ox.map(q => `${q}+ = ${e.sa[q]}`).join(', ')}.`);
    }
  }
  for (const [ai] of c.ans) {
    if (ai.x) notes.push(`En ${ai.f}: el ${EL[ai.c].n} tiene estado de oxidación +${ai.x} → (${ROM[ai.x]}).`);
  }
  return notes;
}

      const id = pick(['Cl', 'Br', 'I', 'F', 'NO3', 'NO2', 'ClO3', 'SO4', 'CO3', 'PO4', 'SO3']);
      const nC = pick([1, 1, 2]), k = nC * c.q - an(id).q;

  hidrato: () => {
    const n = pick([2, 3, 4, 5, 6, 7, 8, 10]);

      const c = randMetalCat({ noMany: true });
      base = Math.random() < 0.6 ? C.oxosal(c.sym, c.q, pick(['SO4', 'NO3', 'CO3', 'PO4', 'ClO3', 'SO3', 'ClO4'])) : C.salBin(c.sym, c.q, pick(['Cl', 'Br', 'I', 'F']));
      if (base.cats[0][1] <= 3) break;

const MULTI_CATS = () => (Math.random() < 0.1 ? ['NH4', 1] : (() => { const c = randMetalCat({ noMany: true }); return [c.sym, c.q]; })());
const MULTI_ANS = ['F', 'Cl', 'Br', 'I', 'S', 'NO3', 'SO4', 'CO3', 'ClO3', 'CrO4', 'PO4', 'C2O4', 'Cr2O7', 'NO2'];
function genMulti(kind) {
  const [nc, na] = kind.match(/\d/g).map(Number);
  for (let t = 0; t < 400; t++) {
    const cats = []; while (cats.length < nc) { const c = MULTI_CATS(); if (!cats.some(x => x[0] === c[0])) cats.push(c); }
    const ids = shuffle(MULTI_ANS).slice(0, na);
    const pos = cats.reduce((s, c) => s + c[1], 0);
    if (na === 1) { const q = an(ids[0]).q; if (pos % q === 0 && pos / q <= 6) return C.multi(cats, [[ids[0], pos / q]]); continue; }
    // varios aniones: busca cantidades pequeñas que sumen la carga positiva
    const qsA = ids.map(id => an(id).q);
    const combos = na === 2 ? [[1, 1], [2, 1], [1, 2], [3, 1], [1, 3], [2, 2]] : [[1, 1, 1], [2, 1, 1], [1, 2, 1], [1, 1, 2]];
    for (const m of shuffle(combos)) {
      if (m.reduce((s, x, i) => s + x * qsA[i], 0) === pos) return C.multi(cats, ids.map((id, i) => [id, m[i]]));
    }
  }
  return C.multi([['K', 1], ['Na', 1]], [['SO4', 1]]);
}
function randomCompound(type) { return GEN[type](); }

/* ---------- Tarjetas (componente) ---------- */
let fc = null; // estado del mazo actual
function startDeck(cards, opts = {}) {
  fc = { all: cards, queue: shuffle(cards), done: 0, wrong: new Set(), flipped: false, dir: opts.dir || fc?.dir || 'n2s', mount: opts.mount, title: opts.title };
  renderCard();
}
function cardFaces(card) {
  let dir = fc.dir === 'mix' ? (card._d || (card._d = Math.random() < 0.5 ? 'n2s' : 's2n')) : fc.dir;
  if (card.oneWay) dir = 'n2s';
  const nameFace = `<div class="face-name">${esc(card.name)}</div>`;
  const symFace = `<div class="face-sym ${card.hue}">${card.sym}</div>`;
  return dir === 'n2s' ? [nameFace, symFace] : [symFace, nameFace];
}
function renderCard() {
  const m = fc.mount();
  if (!fc.queue.length) {
    m.innerHTML = `<div class="deck-done">
      <p class="eyebrow">Mazo completo</p>
      <h3>${fc.all.length} de ${fc.all.length} tarjetas</h3>
      <p class="muted">${fc.wrong.size ? `Fallaste ${fc.wrong.size} en el primer intento.` : 'Te las sabías todas al primer intento.'}</p>
      <div class="row">
        ${fc.wrong.size ? '<button class="btn primary" id="fc-wrong">Repasar las que fallé</button>' : ''}
        <button class="btn" id="fc-again">Repetir el mazo</button>
      </div></div>`;
    $('#fc-again', m).onclick = () => startDeck(fc.all, { mount: fc.mount });
    const w = $('#fc-wrong', m); if (w) w.onclick = () => startDeck(fc.all.filter(c => fc.wrong.has(c.id)), { mount: fc.mount });
    return;
  }
  const card = fc.queue[0];
  const [front, back] = cardFaces(card);
  const total = fc.all.length;
  m.innerHTML = `
    <div class="fc-meta"><span>Quedan <b>${fc.queue.length}</b></span><span class="bar"><i style="width:${(100 * fc.done) / total}%"></i></span><span><b>${fc.done}</b>/${total}</span></div>
    <button class="flash ${fc.flipped ? 'is-flipped' : ''}" id="flash" aria-label="Voltear tarjeta">
      <span class="flash-in">
        <span class="flash-face front">${front}<span class="flip-hint">Toca para voltear</span></span>
        <span class="flash-face back">${back}${card.note ? `<span class="face-note">${esc(card.note)}</span>` : ''}</span>
      </span>
    </button>
    <div class="row fc-actions" id="fc-actions"></div>`;
  $('#flash', m).onclick = flip;
  renderActions();
}
function renderActions() {
  const box = $('#fc-actions'); if (!box) return;
  box.innerHTML = fc.flipped
    ? '<button class="btn bad" id="fc-no"><kbd>1</kbd> No me la sabía</button><button class="btn good" id="fc-yes"><kbd>2</kbd> Me la sabía</button>'
    : '<button class="btn primary wide" id="fc-flip">Voltear <kbd>espacio</kbd></button>';
  if (fc.flipped) { $('#fc-no').onclick = () => answerCard(false); $('#fc-yes').onclick = () => answerCard(true); }
  else $('#fc-flip').onclick = flip;
}
function flip() { fc.flipped = !fc.flipped; const el = $('#flash'); if (el) el.classList.toggle('is-flipped', fc.flipped); renderActions(); }
function answerCard(ok) {
  const card = fc.queue.shift();
  store.cards[card.id] = ok ? 1 : 0; save();
  if (ok) fc.done++;
  else { fc.wrong.add(card.id); fc.queue.splice(Math.min(3, fc.queue.length), 0, card); }
  fc.flipped = false; delete card._d;
  renderCard(); refreshDeckChips && refreshDeckChips();
}
document.addEventListener('keydown', e => {
  if (!fc || !$('#flash') || /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); if (!fc.flipped) flip(); }
  else if (fc.flipped && e.key === '1') answerCard(false);
  else if (fc.flipped && e.key === '2') answerCard(true);
});

/* ---------- Iones ---------- */
let ionState = { deck: 'mono', sub: 'Cationes de carga fija', mode: 'cards', dir: 'n2s' };
let refreshDeckChips = null;
function viewIons() {
  const d = DECKS[ionState.deck];
  if (!d.subs[ionState.sub] && ionState.sub !== '__all') ionState.sub = Object.keys(d.subs)[0];
  const cards = ionState.sub === '__all' ? Object.values(d.subs).flat() : d.subs[ionState.sub];
  view().innerHTML = `
  <section class="page-head">
    <div><p class="eyebrow">Sección 1</p><h1>Iones</h1>
    <p class="lede">Las cargas de la hoja “Números de oxidación”. Sin ellas no se puede nombrar ni formular nada.</p></div>${ptile(1, 'Io', 'Iones')}
  </section>
  <div class="seg" role="tablist">
    ${Object.entries(DECKS).map(([k, v]) => `<button role="tab" aria-selected="${k === ionState.deck}" data-deck="${k}">${v.label}</button>`).join('')}
  </div>
  <div class="chips" id="sub-chips"></div>
  <div class="toolbar">
    <label class="sel">Dirección
      <select id="fc-dir">
        <option value="n2s">Nombre → ion</option><option value="s2n">Ion → nombre</option><option value="mix">Mezclado</option>
      </select></label>
    <div class="seg small">
      <button data-mode="cards" aria-selected="${ionState.mode === 'cards'}">Tarjetas</button>
      <button data-mode="list" aria-selected="${ionState.mode === 'list'}">Lista</button>
    </div>
  </div>
  <div id="ion-stage"></div>`;
  refreshDeckChips = () => {
    const box = $('#sub-chips'); if (!box) return;
    const subs = Object.entries(d.subs);
    const [ak, at] = deckStats(subs.flatMap(([, v]) => v));
    box.innerHTML = subs.map(([k, v]) => { const [kk, tt] = deckStats(v); return `<button class="chip" aria-pressed="${ionState.sub === k}" data-sub="${esc(k)}">${esc(k)} <span class="num">${kk}/${tt}</span></button>`; }).join('')
      + `<button class="chip" aria-pressed="${ionState.sub === '__all'}" data-sub="__all">Todo ${esc(d.label.toLowerCase())} <span class="num">${ak}/${at}</span></button>`;
    $$('[data-sub]', box).forEach(b => b.onclick = () => { ionState.sub = b.dataset.sub; viewIons(); });
  };
  refreshDeckChips();
  $$('[data-deck]').forEach(b => b.onclick = () => { ionState.deck = b.dataset.deck; ionState.sub = Object.keys(DECKS[b.dataset.deck].subs)[0]; viewIons(); });
  $$('[data-mode]').forEach(b => b.onclick = () => { ionState.mode = b.dataset.mode; viewIons(); });
  const dirSel = $('#fc-dir'); dirSel.value = ionState.dir;
  dirSel.onchange = () => { ionState.dir = dirSel.value; viewIons(); };
  if (ionState.mode === 'list') {
    fc = null;
    $('#ion-stage').innerHTML = `<div class="ion-grid">${cards.map(c => `<div class="ion-tile ${store.cards[c.id] === 1 ? 'known' : ''}">
      <span class="ion-sym ${c.hue}">${c.sym}</span><span class="ion-name">${esc(c.name)}</span>${c.note ? `<span class="ion-note">${esc(c.note)}</span>` : ''}</div>`).join('')}</div>
      ${ionState.deck === 'mono' && ionState.sub === 'Cationes con muchas cargas' ? '<p class="muted small">Cloro, bromo y yodo: hipo-…-oso (1+), -oso (3+), -ico (5+), per-…-ico (7+). Igual para bromo (hipobromoso…) y yodo (hipoyodoso…).</p>' : ''}`;
  } else startDeck(cards, { dir: ionState.dir, mount: () => $('#ion-stage') });
}

/* ---------- Teoría ---------- */
const exName = (c, s) => cap(canonical(c, s));
function sysTable(rows) {
  return `<div class="tbl-wrap"><table class="sys">
    <thead><tr><th>Sistema</th><th>Patrón</th><th>Ejemplo</th></tr></thead>
    <tbody>${rows.map(([c, s]) => `<tr><td><span class="sys-tag">${s}</span></td><td>${esc(patternFor(c, s))}</td><td class="ex">${fx(c.formula)} <span class="arr">→</span> ${esc(exName(c, s))}</td></tr>`).join('')}</tbody>
  </table></div>`;
}
function group(o) {
  return `<section class="grp" id="${o.id}">
    <h3>${o.title}</h3>
    <p>${o.def}</p>
    <dl class="meta">
      <div><dt>Fórmula general</dt><dd>${o.gen}</dd></div>
      <div><dt>Cómo reconocerlo</dt><dd>${o.recog}</dd></div>
    </dl>
    ${o.extra || ''}
    ${o.rows ? sysTable(o.rows) : ''}
  </section>`;
}
function theoryBasics() {
  return `
  <section class="grp">
    <h3>¿Qué es un grupo funcional?</h3>
    <p>Un grupo funcional es un átomo o grupo de átomos que le da sus propiedades principales a un conjunto de compuestos. Por ejemplo, el ion OH<sup>1−</sup> hace que un compuesto sea un hidróxido.</p>
    <p>Los compuestos inorgánicos se clasifican en <b>binarios</b> (2 elementos), <b>ternarios</b> (3) y <b>cuaternarios</b> (4 o más).</p>
  </section>
  <section class="grp">
    <h3>Cómo clasificar un compuesto</h3>
    <div class="tree">
      <div class="node"><b>¿Tiene 2 elementos?</b> Es binario.
        <ul>
          <li>Tiene <b>O</b> y un metal → <b>óxido metálico</b>, o <b>peróxido</b> si el oxígeno “sobra” para la carga del metal (ZnO<sub>2</sub>, Na<sub>2</sub>O<sub>2</sub>).</li>
          <li>Tiene <b>O</b> y un no metal → <b>óxido no metálico</b> (anhídrido).</li>
          <li>Tiene <b>H escrito primero</b> con F, Cl, Br, I, S, Se o Te → <b>hidrácido</b> (H<sub>2</sub>S).</li>
          <li>Tiene <b>H escrito al final</b> → <b>hidruro</b>: metálico (FeH<sub>3</sub>) o no metálico (SH<sub>2</sub>, NH<sub>3</sub>).</li>
          <li>Metal + no metal, sin O ni H → <b>sal binaria</b>.</li>
        </ul></div>
      <div class="node"><b>¿Tiene 3 elementos?</b> Es ternario.
        <ul>
          <li>Termina en <b>OH</b> → <b>hidróxido</b> (base).</li>
          <li>Empieza con <b>H</b> + ion poliatómico con O → <b>oxoácido</b>.</li>
          <li>Metal o NH<sub>4</sub> + ion poliatómico con O → <b>oxosal</b> (sal neutra).</li>
        </ul></div>
      <div class="node"><b>¿Más elementos o partes extra?</b>
        <ul>
          <li>El anión todavía tiene <b>H</b> (HCO<sub>3</sub>, H<sub>2</sub>PO<sub>4</sub>) → <b>sal ácida</b>.</li>
          <li>Tiene <b>OH</b> y además otro anión → <b>sal básica</b>.</li>
          <li>Dos cationes o dos aniones → <b>sal doble</b>; tres → <b>sal triple</b>.</li>
          <li>Lleva <b>·nH<sub>2</sub>O</b> → <b>sal hidratada</b>.</li>
        </ul></div>
    </div>
  </section>
  <section class="grp">
    <h3>Sistemas de nomenclatura</h3>
    <div class="tbl-wrap"><table class="sys">
      <thead><tr><th>Sigla</th><th>Sistema</th><th>Idea clave</th><th>Ejemplo</th></tr></thead>
      <tbody>
        <tr><td><span class="sys-tag">SA</span></td><td>Antiguo o tradicional</td><td>-oso para la carga menor, -ico para la mayor. Con 3 o 4 cargas: hipo-…-oso, -oso, -ico, per-…-ico.</td><td>${fx('FeCl3')} → Cloruro férrico</td></tr>
        <tr><td><span class="sys-tag">SS</span></td><td>Stock</td><td>Carga del catión en números romanos, entre paréntesis.</td><td>${fx('FeCl3')} → Cloruro de hierro (III)</td></tr>
        <tr><td><span class="sys-tag">SE</span></td><td>Estequiométrico</td><td>Prefijos griegos para cuántos átomos o iones hay. “Mono” casi nunca se escribe.</td><td>${fx('N2O3')} → Trióxido de dinitrógeno</td></tr>
        <tr><td><span class="sys-tag">NF</span></td><td>Nombre funcional</td><td>Para iones de carga fija: anión de catión. También nombra los ácidos (ácido …hídrico, …oso, …ico).</td><td>${fx('NaCl')} → Cloruro de sodio</td></tr>
        <tr><td><span class="sys-tag">SI</span></td><td>IUPAC</td><td>Combina stock y estequiométrico: prefijo-oxo + anión en -ato + (estado de oxidación) de catión.</td><td>${fx('H2MnO4')} → Tetraoxomanganato (VI) de dihidrógeno</td></tr>
        <tr><td><span class="sys-tag">NV</span></td><td>Nombre vulgar</td><td>Nombre común que no sigue reglas; se memoriza.</td><td>${fx('NH3')} → Amoníaco</td></tr>
      </tbody></table></div>
    <p class="small muted">Sistemas combinados (SE/SS, SI/SS): el sistema de la izquierda se usa para el anión y el de la derecha para el catión.</p>
  </section>
  <section class="grp">
    <h3>Prefijos</h3>
    <div class="pref">
      <div><h4>Griegos (cantidad)</h4><p>${GR.slice(1).map((p, i) => `<span><b>${i + 1}</b> ${p}</span>`).join('')}</p></div>
      <div><h4>Especiales (iones entre paréntesis, IUPAC)</h4><p>${ESP.slice(2).map((p, i) => `<span><b>${i + 2}</b> ${p}</span>`).join('')}</p></div>
    </div>
  </section>
  <section class="grp">
    <h3>Hallar la carga del catión (para nombrar)</h3>
    <p>La suma de las cargas de un compuesto es cero. Multiplica la carga del anión por su subíndice y repártela entre los cationes.</p>
    <div class="worked">${fx('Fe2O3')}: 3 × O (2−) = 6− → 6 ÷ 2 Fe = <b>3+</b> → hierro (III) o férrico.</div>
    <h3>Cruzar cargas (para formular)</h3>
    <p>La carga de uno pasa a ser el subíndice del otro, y luego se simplifica si se puede. Si hay más de un ion poliatómico, va entre paréntesis.</p>
    <div class="worked">Al<sup>3+</sup> + SO<sub>4</sub><sup>2−</sup> → ${fx('Al2(SO4)3')} · Pb<sup>4+</sup> + S<sup>2−</sup> → Pb<sub>2</sub>S<sub>4</sub> → ${fx('PbS2')}</div>
    <p class="small muted">Excepción: en los peróxidos el ion es O<sub>2</sub><sup>2−</sup> y no se simplifica el 2 del oxígeno (Na<sub>2</sub>O<sub>2</sub>, Sc<sub>2</sub>O<sub>6</sub>).</p>
  </section>`;
}

let pracCfg = { tema: '1', mode: 'mix', n: 10 };
let sess = null;
const TYPE_WEIGHT = { hidracido: 1, hidruro_m: 1.2, hidruro_nm: 1.2, oxido_m: 1.3, oxido_nm: 1.3, peroxido: 0.8, sal_bin: 1.5, hidroxido: 1, oxoacido: 1.2, oxosal: 1.6, sal_acida: 1, sal_basica: 1, sal_doble: 0.8, sal_triple: 0.5, hidrato: 0.8 };
const SYS_WEIGHT = { NF: 1, SA: 1, SS: 1, SE: 1, SI: 1, 'SE/SS': 0.5, 'SI/SS': 0.5, NV: 0.6 };
function wpick(items, w) { const tot = items.reduce((s, x) => s + w(x), 0); let r = Math.random() * tot; for (const x of items) { r -= w(x); if (r <= 0) return x; } return items[items.length - 1]; }
function temaTypes(t) { return t === 'mix' ? [...TEMA_TYPES[1], ...TEMA_TYPES[2], ...TEMA_TYPES[3]] : TEMA_TYPES[t]; }
function buildQuestions(cfg) {
  const out = [], seen = new Set();
  const pracPool = shuffle(cfg.tema === 'mix' ? [...PRAC[1], ...PRAC[2], ...PRAC[3]] : PRAC[cfg.tema]);
  const nPrac = Math.round(cfg.n * 0.35);
  for (const [f, sys, m] of pracPool) {
    if (out.length >= nPrac) break;
    const c = f(); const key = c.formula + sys;
    if (seen.has(key)) continue; seen.add(key);
    out.push({ c, sys, mode: cfg.mode === 'mix' ? m : cfg.mode, prac: true });
  }
  let guard = 0;
  while (out.length < cfg.n && guard++ < 500) {
    const type = wpick(temaTypes(cfg.tema), t => TYPE_WEIGHT[t]);
    const c = randomCompound(type);
    let syss = systemsFor(c);
    const nf = canonical(c, 'NF');
    if (syss.length > 1) syss = syss.filter(s => !(s === 'SE' && nf && norm(canonical(c, 'SE')) === norm(nf)));
    const sys = wpick(syss, s => SYS_WEIGHT[s]);
    const key = c.formula + sys;
    if (seen.has(key)) continue; seen.add(key);
    out.push({ c, sys, mode: cfg.mode === 'mix' ? (Math.random() < 0.5 ? 'n' : 'f') : cfg.mode, prac: false });
  }
  return shuffle(out);
}
function viewPractice() {

function keypadSymbols(c) {
  const need = Object.keys(c.atoms);
  const pool = shuffle(SYMBOLS.filter(s => !need.includes(s)));
  const set = new Set([...need, 'O', 'H', ...pool.slice(0, 4)]);
  return [...set].sort((a, b) => a.localeCompare(b));
}
function groupOptions(tema) { return temaTypes(tema); }

    <div id="hint-box"></div>

    <div id="feedback"></div>

  let chosen = null;
  $$('[data-g]').forEach(b => b.onclick = () => { if (q.done) return; chosen = b.dataset.g; $$('[data-g]').forEach(x => x.setAttribute('aria-pressed', x === b)); });

    <button class="btn ${wrong.length ? '' : 'primary'}" id="again">Nueva ronda</button>
    <button class="btn" id="change">Cambiar tema</button>
  </div>
  <ul class="res-list">${sess.results.map(q => `<li class="${q.ok ? 'ok' : 'no'}">
    <span class="mark" aria-label="${q.ok ? 'correcta' : 'incorrecta'}">${q.ok ? '✓' : '✗'}</span>
    <span class="res-f">${fmtF(q.c.formula)}</span>
    <span class="res-n"><span class="sys-tag">${q.sys}</span> ${esc(cap(canonical(q.c, q.sys)))}<small>${TYPE_LABEL[q.c.type]}</small></span></li>`).join('')}</ul>`;
  const r = $('#redo'); if (r) r.onclick = () => startSession(shuffle(wrong.map(q => ({ c: q.c, sys: q.sys, mode: q.mode, prac: q.prac }))));
  $('#again').onclick = () => startSession(buildQuestions(pracCfg));
  $('#change').onclick = () => { sess = null; renderSetup(); };
}

/* ---------- Nombres vulgares ---------- */
let vulgTab = 'cards', vq = null;
function viewVulg() {
  view().innerHTML = `
  <section class="page-head"><div><p class="eyebrow">Sección 4</p><h1>Nombres vulgares</h1>
    <p class="lede">La tabla de nombres comunes de tu guía. No siguen reglas: hay que memorizarlos.</p></div>${ptile(4, 'Nv', 'Vulgares')}</section>
  <div class="seg">
    <button data-vt="cards" aria-selected="${vulgTab === 'cards'}">Tarjetas</button>
    <button data-vt="quiz" aria-selected="${vulgTab === 'quiz'}">Quiz</button>
    <button data-vt="list" aria-selected="${vulgTab === 'list'}">Tabla</button></div>
  <div id="vulg-stage"></div>
  <p class="small muted">Nota: tu guía pone “yeso” junto al CaCO<sub>3</sub>. Aquí se respeta, pero en muchos libros el yeso es CaSO<sub>4</sub>·2H<sub>2</sub>O.</p>`;
  $$('[data-vt]').forEach(b => b.onclick = () => { vulgTab = b.dataset.vt; vq = null; viewVulg(); });
  const st = $('#vulg-stage');
  if (vulgTab === 'cards') { refreshDeckChips = null; startDeck(VULG_CARDS, { dir: 'n2s', mount: () => $('#vulg-stage') }); }
  else if (vulgTab === 'list') {
    fc = null;
    st.innerHTML = `<div class="tbl-wrap"><table class="sys"><thead><tr><th>Nombre común</th><th>Fórmula</th></tr></thead>
      <tbody>${VULG.map(([f, n]) => `<tr><td>${esc(VULG_DISPLAY[f] || cap(n[0]))}</td><td>${fx(f)}</td></tr>`).join('')}</tbody></table></div>`;
  } else { fc = null; if (!vq) vq = { qs: shuffle(VULG).slice(0, 10).map(v => ({ v, dir: Math.random() < 0.5 ? 'n2f' : 'f2n' })), i: 0, score: 0 }; renderVQ(); }
}
function renderVQ() {
  const st = $('#vulg-stage');
  if (vq.i >= vq.qs.length) {
    st.innerHTML = `<div class="deck-done"><p class="eyebrow">Quiz terminado</p><h3>${vq.score} de ${vq.qs.length}</h3>
      <div class="row"><button class="btn primary" id="vq-again">Otro quiz</button></div></div>`;
    $('#vq-again').onclick = () => { vq = null; viewVulg(); };
    return;
  }
  const { v: [f, names], dir } = vq.qs[vq.i];
  const others = shuffle(VULG.filter(x => x[0] !== f)).slice(0, 3);
  const opts = shuffle([[f, names], ...others]);
  const label = x => (dir === 'n2f' ? fmtF(x[0]) : esc(VULG_DISPLAY[x[0]] || cap(x[1][0])));
  st.innerHTML = `<div class="qcard vq">
    <div class="fc-meta"><span>Pregunta <b>${vq.i + 1}</b> de ${vq.qs.length}</span><span class="bar"><i style="width:${(100 * vq.i) / vq.qs.length}%"></i></span><span><b>${vq.score}</b> ✓</span></div>
    <p class="q-ask">${dir === 'n2f' ? '¿Cuál es la fórmula de…' : '¿Cuál es el nombre común de…'}</p>
    <div class="${dir === 'n2f' ? 'q-name' : 'q-formula'}">${dir === 'n2f' ? esc(VULG_DISPLAY[f] || cap(names[0])) : fmtF(f)}</div>
    <div class="mc">${opts.map((o, i) => `<button class="mc-opt ${dir === 'n2f' ? 'mono' : ''}" data-i="${i}">${label(o)}</button>`).join('')}</div>
    <div id="vq-next"></div></div>`;
  $$('.mc-opt', st).forEach(b => b.onclick = () => {
    if (vq.answered) return; vq.answered = true;
    const ok = opts[+b.dataset.i][0] === f;
    if (ok) vq.score++;
    store.vulg.tot++; if (ok) store.vulg.ok++;
    store.cards['v:' + f] = ok ? 1 : 0; save();
    $$('.mc-opt', st).forEach((x, i) => { if (opts[i][0] === f) x.classList.add('right'); else if (x === b) x.classList.add('wrong'); });
    $('#vq-next').innerHTML = `<div class="row"><button class="btn primary" id="vq-n">${vq.i + 1 < vq.qs.length ? 'Siguiente →' : 'Ver resultado'}</button></div>`;
    $('#vq-n').onclick = () => { vq.i++; vq.answered = false; renderVQ(); };
    $('#vq-n').focus();
  });
}

route();

</script>
